; Aquarius v0.0.1 — CYD environmental sensor hardware test
;
; This first milestone deliberately does not use the display.
; It verifies the BME280/BMP280 and GPIO22/GPIO27 wiring.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit BMP280 Library

build_flags =
    -Wall
    -Wextra
